<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>미리보기</title>
<style>
  html,body{margin:0;height:100%;background:#08090c;display:grid;place-items:center;font-family:system-ui,sans-serif}
  .phone{width:390px;height:790px;border-radius:44px;padding:10px;background:linear-gradient(160deg,#2b2f3a,#12141a);box-shadow:0 30px 80px rgba(0,0,0,.7), 0 0 0 1px #3a4050 inset}
  .screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:#0e1013;position:relative}
  iframe{width:100%;height:100%;border:0;display:block}
  .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:22px;border-radius:20px;background:#08090c;z-index:5}
</style>
</head>
<body>
<div class="phone"><div class="screen"><div class="notch"></div><iframe src="./?pv=4" title="빠른 메모 미리보기"></iframe></div></div>
</body>
</html>
