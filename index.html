<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<title>빠른 메모 — 채팅처럼 초고속 메모</title>
<meta name="description" content="카톡 '나에게 쓰기' 대신 쓰는 채팅형 초고속 메모장. 실시간 검색·태그·사진·할일·백업, 폰 안에만 저장." />
<meta name="theme-color" content="#0e1013" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="빠른 메모" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="toprow">
      <div class="brand">
        <span class="logo">💬</span>
        <span class="brandname">빠른 메모</span>
        <span class="badge" id="totalBadge">0</span>
      </div>
      <div class="topbtns">
        <button class="iconbtn" id="btnTheme" title="테마 전환" aria-label="테마 전환">🌙</button>
        <button class="iconbtn" id="btnMenu" title="더보기" aria-label="더보기">⋯</button>
      </div>
    </div>

    <div class="searchbox">
      <span class="sicon" aria-hidden="true">🔍</span>
      <input id="q" type="search" placeholder="검색 — 띄어쓰기로 여러 단어" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" />
      <span class="qcount" id="qcount"></span>
      <button class="qclear" id="qclear" aria-label="검색 지우기" hidden>✕</button>
    </div>

    <div class="chips" id="chips" role="tablist" aria-label="빠른 필터"></div>
  </header>

  <main class="list" id="list" aria-live="polite"></main>

  <button class="jump" id="jumpBottom" hidden>↓ 최신</button>

  <div class="toast" id="toast" role="status" hidden>
    <span class="toast-msg" id="toastMsg"></span>
    <button class="toast-act" id="toastAct">실행취소</button>
  </div>

  <footer class="composer" id="composer">
    <div class="editbar" id="editbar" hidden>
      <span>✏️ 수정 중</span>
      <button id="editCancel">취소</button>
    </div>
    <div class="attach" id="attach" hidden>
      <img id="attachImg" alt="첨부 미리보기" />
      <button id="attachRemove" aria-label="첨부 취소">✕</button>
    </div>
    <div class="inputrow">
      <button class="cbtn" id="btnPhoto" title="사진 첨부" aria-label="사진 첨부">🖼️</button>
      <textarea id="input" rows="1" placeholder="메모 입력…" enterkeyhint="send" autocapitalize="sentences" spellcheck="false" autocorrect="off"></textarea>
      <button class="cbtn" id="btnTodo" title="할일 추가" aria-label="할일 추가">☑️</button>
      <button class="send" id="btnSend" title="전송" aria-label="전송">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 11.5 20 4l-7.5 16-2.2-6.3L4 11.5Z" fill="currentColor"/></svg>
      </button>
    </div>
    <input type="file" id="fileInput" accept="image/*" hidden />
    <input type="file" id="importInput" accept="application/json,.json" hidden />
  </footer>
</div>

<div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt="" /></div>

<div class="sheetback" id="sheetback" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-grab"></div>
  <h2>더보기</h2>
  <button class="sheetitem" data-act="export"><span>💾</span><div><b>JSON 백업 내보내기</b><small>메모·사진 전부 파일 하나로</small></div></button>
  <button class="sheetitem" data-act="import"><span>📥</span><div><b>JSON 가져오기</b><small>백업 파일 합치기 (중복은 건너뜀)</small></div></button>
  <button class="sheetitem" data-act="trash"><span>🗑️</span><div><b>휴지통</b><small id="trashCount">삭제한 메모 복원·완전삭제</small></div></button>
  <button class="sheetitem" data-act="theme"><span>🎨</span><div><b>테마 전환</b><small>다크 ↔ 라이트</small></div></button>
  <div class="sheetinfo" id="sheetInfo">저장 위치: 이 브라우저 안 (서버 전송 없음)</div>
  <button class="sheetclose" id="sheetClose">닫기</button>
</div>

<script src="app.js?v=3"></script>
</body>
</html>
